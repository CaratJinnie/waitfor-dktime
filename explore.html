<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore DK · Waiting for DK</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"></head><body><div class="wrap"><nav class="site-nav"></nav>
<section class="glass section"><div class="eyebrow">EXPLORE DK</div><h1 class="page-title">Follow your mood,<br>not a menu.</h1><p class="lede">先选“今天想遇见怎样的 DK”，网站再把你带到对应的记忆。</p></section>
<section class="glass section"><div class="section-head"><div><div class="eyebrow">MOOD PORTALS</div><h2 class="section-title">How do you want to meet DK?</h2></div></div>
 <div class="moods">
  <button class="mood" data-mood="comfort"><span class="icon">🌻</span><b>想被治愈</b><span>Cheer me up</span></button>
  <button class="mood" data-mood="miss"><span class="icon">💙</span><b>今天很想他</b><span>I miss him</span></button>
  <button class="mood" data-mood="look"><span class="icon">📸</span><b>想看造型</b><span>Find a look</span></button>
  <button class="mood" data-mood="work"><span class="icon">💼</span><b>下班了</b><span>After work</span></button>
  <button class="mood" data-mood="sleep"><span class="icon">🌙</span><b>睡前</b><span>Before sleep</span></button>
  <button class="mood" id="randomMood"><span class="icon">🎲</span><b>Surprise me</b><span>No context. Just DK.</span></button>
 </div>
</section>
<section class="grid2" style="margin-top:18px">
 <article class="glass panel" id="surprise"><div class="eyebrow">SURPRISE ME, DK!</div><h2 class="section-title">Random Memory</h2><div class="surprise card" id="surpriseCard" style="margin-top:16px"></div><div class="row" style="margin-top:12px"><button class="btn primary" id="again">🎲 Again</button><span class="small" id="discoverCount"></span></div></article>
 <article class="glass panel"><div class="eyebrow">DK SAID THIS TODAY</div><h2 class="section-title">Choose what you need.</h2><div class="row" id="quoteMood" style="margin:14px 0"><button class="btn" data-q="tired">😮‍💨 Tired</button><button class="btn" data-q="stress">🫠 Stressed</button><button class="btn" data-q="work">💼 After work</button><button class="btn" data-q="sleep">🌙 Before sleep</button><button class="btn" data-q="miss">💙 Miss him</button></div><div class="daily-card" id="quoteBox"></div></article>
</section>
<section class="glass section"><div class="section-head"><div><div class="eyebrow">DK UNIVERSE</div><h2 class="section-title">Tap a constellation.</h2></div><p class="lede">星球不是固定菜单，而是把 Archive 从不同角度打开。</p></div>
 <div class="universe"><div class="center-orb">DK<br>Universe</div><button class="orb o1" data-u="message">💬 Messages</button><button class="orb o2" data-u="look">📸 Looks</button><button class="orb o3" data-u="comfort">🌻 Comfort</button><button class="orb o4" data-u="2026">🗓 2026</button><button class="orb o5" data-u="weverse">🩵 Weverse</button><button class="orb o6" data-u="photo">✨ Photos</button></div><div class="row" id="universeResult" style="margin-top:14px"></div>
</section>
<footer class="footer"></footer></div><div class="modal-back" id="modalBack"><div class="modal"><button class="close" id="modalClose">×</button><div id="modalContent"></div></div></div><script src="assets/data.js"></script><script src="assets/app.js"></script><script>
let discovered=new Set(JSON.parse(localStorage.getItem("dk-discovered")||"[]"));
function renderSurprise(m){const img=m.image?`<div class="surprise-img"><img src="${m.image}" alt=""></div>`:"";surpriseCard.innerHTML=`${img}<div class="surprise-body"><div class="eyebrow">${m.accent} ${m.source} · ${m.date}</div><h3>${txt(m.title)}</h3><p class="lede">${txt(m.excerpt)}</p><a class="btn" target="_blank" href="${m.url}">${TEXT[LANG].open} ↗</a></div>`;discovered.add(m.id);localStorage.setItem("dk-discovered",JSON.stringify([...discovered]));discoverCount.textContent=`${discovered.size} / ${DATA.moments.length} discovered`}
function randomMoment(filter){let arr=filter?DATA.moments.filter(filter):DATA.moments;if(!arr.length)arr=DATA.moments;renderSurprise(arr[Math.floor(Math.random()*arr.length)])}
function quote(mood){let arr=DATA.quotes.filter(q=>q.moods.includes(mood));if(!arr.length)arr=DATA.quotes;let q=arr[Math.floor(Math.random()*arr.length)];quoteBox.innerHTML=`<div class="serif" style="font-size:2rem">${q.ko}</div><p class="lede">${q[LANG]||q.en}</p><a class="btn" target="_blank" href="${q.url}">${TEXT[LANG].open} ↗</a>`}
document.addEventListener("DOMContentLoaded",()=>{randomMoment();quote("tired");document.querySelectorAll("[data-mood]").forEach(b=>b.onclick=()=>randomMoment(m=>m.moods?.includes(b.dataset.mood)||m.tags?.some(t=>String(t).toLowerCase().includes(b.dataset.mood))));randomMood.onclick=()=>randomMoment();again.onclick=()=>randomMoment();document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>quote(b.dataset.q));document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const k=b.dataset.u,arr=DATA.moments.filter(m=>m.type===k||m.year===k||m.moods?.includes(k)||m.tags?.some(t=>String(t).toLowerCase().includes(k)));universeResult.innerHTML=arr.length?arr.map(m=>`<button class="btn uitem" data-id="${m.id}">${m.accent} ${txt(m.title)}</button>`).join(""):`<span class="small">This planet will grow as the archive grows.</span>`;document.querySelectorAll(".uitem").forEach(x=>x.onclick=()=>openMoment(DATA.moments.find(m=>m.id===x.dataset.id)))})})
</script><script>document.addEventListener("DOMContentLoaded",()=>initNav("explore"));</script></body></html>
