<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DK Music Room · Waiting for DK</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
<nav class="site-nav"></nav>

<section class="glass section">
 <div class="eyebrow">DK MUSIC ROOM</div>
 <h1 class="page-title">Press play,<br>and let DK find you.</h1>
 <p class="lede">Covers、Solo、OST 和 Special 都放进同一个音乐房间，并统一使用 YouTube。进入页面会先随机遇见一首。</p>
 <div class="music-tabs">
   <button class="music-tab active" data-cat="all">ALL</button>
   <button class="music-tab" data-cat="cover">COVERS</button>
   <button class="music-tab" data-cat="solo">SOLO</button>
   <button class="music-tab" data-cat="ost">OST</button>
   <button class="music-tab" data-cat="special">SPECIAL</button>
 </div>
</section>

<section class="dk-player-page" style="margin-top:18px">
 <article class="glass dk-player-card">
  <div class="skin-player">
    <div class="player-video" id="youtubeStage"><div id="ytPlayer"></div></div>
    <div class="spotify-stage" id="spotifyStage"><div id="spotifyEmbed"></div></div>
    <img class="player-skin" src="assets/dk-player-skin.png" alt="DK player skin">

    <div class="player-progress" id="progressHit">
      <div class="player-progress-track"><div class="player-progress-fill" id="progressFill"></div></div>
    </div>

    <button class="player-hit hit-heart" id="heartBtn" aria-label="Favorite"></button>
    <button class="player-hit hit-prev" id="prevBtn" aria-label="Previous"></button>
    <button class="player-hit hit-play" id="playBtn" aria-label="Play or pause"></button>
    <button class="player-hit hit-next" id="nextBtn" aria-label="Next"></button>
    <button class="player-hit hit-shuffle" id="shuffleBtn" aria-label="Shuffle"></button>
    <button class="player-hit hit-repeat" id="repeatBtn" aria-label="Repeat"></button>

    <div class="play-state-icon" id="playIcon">▶</div>
    <div class="favorite-state" id="favoriteState">♥</div>
    <div class="mode-dot shuffle-dot" id="shuffleDot"></div>
    <div class="mode-dot repeat-dot" id="repeatDot"></div>
  </div>

  <div class="now-playing">
    <div class="row" style="justify-content:space-between">
      <div class="eyebrow" style="margin:0">NOW PLAYING</div>
      <span class="provider-badge" id="providerBadge">YouTube</span>
    </div>
    <h2 id="nowTitle">Loading…</h2>
    <div class="now-meta" id="nowArtist"></div>
    <div class="small" id="nowSubtitle" style="margin-top:4px"></div>
    <div class="time-row"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
    <div class="row" style="margin-top:12px">
      <a class="btn" id="sourceLink" target="_blank">Open source ↗</a>
      <a class="btn" id="behindLink" target="_blank" style="display:none">Behind ↗</a>
    </div>
  </div>
 </article>

 <aside class="glass playlist-panel">
   <div class="eyebrow">PLAYLIST</div>
   <h2 class="section-title" id="playlistTitle">All DK Music</h2>
   <p class="small">点任何一首就会切歌。上面的分类只改变歌单，不改变播放器设计。</p>
   <div class="playlist" id="playlist"></div>
   <p class="player-note">全部曲目统一使用 YouTube 嵌入，所以播放器外观和控制方式都会保持一致。浏览器可能要求你第一次手动点播放。</p>
 </aside>
</section>

<footer class="footer"></footer>
</div>

<div class="modal-back" id="modalBack"><div class="modal"><button class="close" id="modalClose">×</button><div id="modalContent"></div></div></div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
let allTracks=DATA.music||[];
let filtered=allTracks.slice();
let currentIndex=0;
let currentTrack=null;
let ytPlayer=null;
let shuffleMode=localStorage.getItem("dk-shuffle")==="1";
let repeatMode=localStorage.getItem("dk-repeat")==="1";
let currentCategory="all";
let tick=null;

function formatTime(sec){
 sec=Math.max(0,Math.floor(Number(sec)||0));
 const m=Math.floor(sec/60),s=sec%60;
 return `${m}:${String(s).padStart(2,"0")}`;
}
function randomIndex(exclude){
 if(filtered.length<2)return 0;
 let i=exclude;
 while(i===exclude)i=Math.floor(Math.random()*filtered.length);
 return i;
}
function categoryTitle(cat){
 return {all:"All DK Music",cover:"DK Covers",solo:"DK Solo",ost:"DK OST",special:"Special / Collab"}[cat]||"DK Music";
}
function favoriteKey(){return currentTrack?`dk-fav-${currentTrack.id}`:"dk-fav-none"}
function refreshFavorite(){favoriteState.classList.toggle("show",localStorage.getItem(favoriteKey())==="1")}
function showProvider(provider){
 youtubeStage.style.display="block";
 spotifyStage.classList.remove("active");
 providerBadge.textContent="YouTube";
 progressHit.style.opacity="1";
 progressHit.style.pointerEvents="auto";
 currentTime.style.opacity="1";
 duration.style.opacity="1";
}
function renderPlaylist(){
 playlistTitle.textContent=categoryTitle(currentCategory);
 playlist.innerHTML=filtered.length?filtered.map((t,i)=>`
 <button class="track-item ${currentTrack&&t.id===currentTrack.id?"active":""}" data-i="${i}">
  <span class="track-num">${String(i+1).padStart(2,"0")}</span>
  <span><span class="track-title">${t.title}${t.subtitle?` · ${t.subtitle}`:""}</span><span class="track-artist">${t.artist}</span></span>
  <span class="track-lang">${t.category}</span>
 </button>`).join(""):`<div class="music-empty">No tracks in this room yet.</div>`;
 document.querySelectorAll(".track-item").forEach(b=>b.onclick=()=>loadTrack(Number(b.dataset.i),true));
}
function updateMeta(t){
 nowTitle.textContent=t.title;
 nowArtist.textContent=t.artist||"DOKYEOM";
 nowSubtitle.textContent=t.subtitle||"";
 sourceLink.href=t.url;
 if(t.behind){behindLink.href=t.behind;behindLink.style.display=""}else behindLink.style.display="none";
 refreshFavorite();renderPlaylist();
}

function loadYoutube(t,autoplay=true){
 showProvider("youtube");
 if(ytPlayer&&ytPlayer.loadVideoById){
   if(autoplay)ytPlayer.loadVideoById(t.youtube_id); else ytPlayer.cueVideoById(t.youtube_id);
 }
}
function loadTrack(i,autoplay=true){
 if(!filtered.length)return;
 currentIndex=(i+filtered.length)%filtered.length;
 currentTrack=filtered[currentIndex];
 updateMeta(currentTrack);
 loadYoutube(currentTrack,autoplay);
}
function nextTrack(){loadTrack(shuffleMode?randomIndex(currentIndex):currentIndex+1,true)}
function prevTrack(){loadTrack(shuffleMode?randomIndex(currentIndex):currentIndex-1,true)}

heartBtn.onclick=()=>{
 const k=favoriteKey();
 if(localStorage.getItem(k)==="1")localStorage.removeItem(k);else localStorage.setItem(k,"1");
 refreshFavorite();
};
prevBtn.onclick=prevTrack;
nextBtn.onclick=nextTrack;
shuffleBtn.onclick=()=>{shuffleMode=!shuffleMode;localStorage.setItem("dk-shuffle",shuffleMode?"1":"0");shuffleDot.classList.toggle("show",shuffleMode)};
repeatBtn.onclick=()=>{repeatMode=!repeatMode;localStorage.setItem("dk-repeat",repeatMode?"1":"0");repeatDot.classList.toggle("show",repeatMode)};
playBtn.onclick=()=>{
 if(!currentTrack||!ytPlayer)return;
 const s=ytPlayer.getPlayerState();
 s===YT.PlayerState.PLAYING?ytPlayer.pauseVideo():ytPlayer.playVideo();
};
progressHit.onclick=e=>{
 if(!currentTrack||!ytPlayer||!ytPlayer.getDuration)return;
 const rect=progressHit.getBoundingClientRect(),ratio=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
 ytPlayer.seekTo(ytPlayer.getDuration()*ratio,true);
};

function setCategory(cat){
 currentCategory=cat;
 document.querySelectorAll(".music-tab").forEach(b=>b.classList.toggle("active",b.dataset.cat===cat));
 filtered=cat==="all"?allTracks.slice():allTracks.filter(t=>t.category===cat);
 renderPlaylist();
 if(filtered.length)loadTrack(Math.floor(Math.random()*filtered.length),false);
}

function onYouTubeIframeAPIReady(){
 const firstYT=allTracks.find(t=>t.provider==="youtube");
 ytPlayer=new YT.Player("ytPlayer",{
   videoId:firstYT?firstYT.youtube_id:"",
   playerVars:{autoplay:0,controls:0,rel:0,playsinline:1,enablejsapi:1},
   events:{
    onStateChange:e=>{
      if(currentTrack)playIcon.textContent=e.data===YT.PlayerState.PLAYING?"Ⅱ":"▶";
      if(e.data===YT.PlayerState.ENDED&&currentTrack){
        repeatMode?(ytPlayer.seekTo(0),ytPlayer.playVideo()):nextTrack();
      }
    }
   }
 });
 tick=setInterval(()=>{
   if(!currentTrack||!ytPlayer||!ytPlayer.getDuration)return;
   const dur=ytPlayer.getDuration()||0,cur=ytPlayer.getCurrentTime()||0;
   duration.textContent=formatTime(dur);currentTime.textContent=formatTime(cur);progressFill.style.width=dur?`${cur/dur*100}%`:"0%";
 },500);
}


document.addEventListener("DOMContentLoaded",()=>{
 initNav("archive");
 shuffleDot.classList.toggle("show",shuffleMode);
 repeatDot.classList.toggle("show",repeatMode);
 document.querySelectorAll(".music-tab").forEach(b=>b.onclick=()=>setCategory(b.dataset.cat));
 filtered=allTracks.slice();
 renderPlaylist();
 if(filtered.length)loadTrack(Math.floor(Math.random()*filtered.length),false);
});
</script>
</body>
</html>
