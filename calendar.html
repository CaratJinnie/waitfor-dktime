<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Countdown Calendar · Waiting for DK</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"></head><body><div class="wrap"><nav class="site-nav"></nav>
<section class="glass section"><div class="calendar-head"><div><div class="eyebrow">COUNTDOWN CALENDAR</div><h1 class="page-title" id="monthTitle">September 2026</h1><p class="lede">每一天都显示对应的 D-Day。已经走过的日期会自动变蓝。</p></div><div class="row"><button class="btn" id="prevMonth">← Previous</button><button class="btn" id="currentMonth">Current Month</button><button class="btn" id="nextMonth">Next →</button></div></div>
<div class="weekdays"><div class="weekday">Mon</div><div class="weekday">Tue</div><div class="weekday">Wed</div><div class="weekday">Thu</div><div class="weekday">Fri</div><div class="weekday">Sat</div><div class="weekday">Sun</div></div><div class="calendar-grid" id="calendarGrid"></div></section>
<section class="glass section"><div class="section-head"><div><div class="eyebrow">PROGRESS</div><h2 class="section-title" data-dday>D-540</h2></div><strong data-progress-text>6 / 546 days</strong></div><div class="progressbar"><div class="fill" data-progress-fill></div></div></section>
<footer class="footer"></footer></div><div class="modal-back" id="modalBack"><div class="modal"><button class="close" id="modalClose">×</button><div id="modalContent"></div></div></div><script src="assets/data.js"></script><script src="assets/app.js"></script><script>
let CM=null;const START={y:2026,m:8},END={y:2028,m:2};function cmp(a,b){return a.y!==b.y?a.y-b.y:a.m-b.m}function clamp(s){if(cmp(s,START)<0)return {...START};if(cmp(s,END)>0)return {...END};return s}function addm(s,n){let y=s.y,m=s.m+n;while(m<0){m+=12;y--}while(m>11){m-=12;y++}return clamp({y,m})}function daysIn(y,m){return new Date(Date.UTC(y,m+1,0)).getUTCDate()}function monday(y,m){return (new Date(Date.UTC(y,m,1)).getUTCDay()+6)%7}function iso(y,m,d){return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`}
function renderCal(){const t=kst();if(!CM)CM=clamp({y:t.y,m:t.m-1});monthTitle.textContent=new Intl.DateTimeFormat(LANG==="zh"?"zh-CN":LANG==="ko"?"ko-KR":"en-US",{year:"numeric",month:"long"}).format(new Date(CM.y,CM.m,1));calendarGrid.innerHTML="";for(let i=0;i<monday(CM.y,CM.m);i++){let e=document.createElement("div");e.className="day empty";calendarGrid.appendChild(e)}for(let d=1;d<=daysIn(CM.y,CM.m);d++){const s=iso(CM.y,CM.m+1,d);let c="outside",meta="";if(s>=ENLISTMENT&&s<=DISCHARGE){const r=diff(s,DISCHARGE),dd=r===0?"D-DAY":`D-${r}`;let label;if(s<t.iso){c="completed";label=TEXT[LANG].past}else if(s===t.iso){c="today";label=TEXT[LANG].today}else{c="future";label=TEXT[LANG].future}meta=`<div class="day-meta">${dd}<span class="badge">${label}</span></div>`}let e=document.createElement("div");e.className="day "+c;e.innerHTML=`<div class="day-number">${d}</div>${meta}`;calendarGrid.appendChild(e)}prevMonth.disabled=cmp(CM,START)<=0;nextMonth.disabled=cmp(CM,END)>=0}
document.addEventListener("DOMContentLoaded",()=>{renderCal();prevMonth.onclick=()=>{CM=addm(CM,-1);renderCal()};nextMonth.onclick=()=>{CM=addm(CM,1);renderCal()};currentMonth.onclick=()=>{const t=kst();CM=clamp({y:t.y,m:t.m-1});renderCal()}})
</script><script>document.addEventListener("DOMContentLoaded",()=>initNav("calendar"));</script></body></html>
