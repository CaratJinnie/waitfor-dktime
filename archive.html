<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DK Archive · Waiting for DK</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"></head><body><div class="wrap"><nav class="site-nav"></nav>
<section class="glass section"><div class="eyebrow">DK ARCHIVE</div><h1 class="page-title">Search less.<br>Discover more.</h1><p class="lede">可以直接搜，也可以从类型、年份或心情筛进去。以后 AI Search 会建立在这里。</p></section>
<section class="glass section"><div class="section-head"><div><div class="eyebrow">COLLECTIONS</div><h2 class="section-title">Enter through a collection.</h2></div></div><div class="portal-grid"><a class="portal" href="covers.html"><span class="icon">🎤</span><div><b>DK Cover Archive</b><span>按语言、情绪与原唱探索 DK 的 Cover。</span></div></a></div></section>
<section class="glass section"><div class="searchbar"><input id="searchInput" placeholder="例如：想看 2026 年让我振作一点的 DK / black hair official photo"><button class="btn primary" id="searchBtn">Search</button></div><div class="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="message">Messages</button><button class="filter" data-filter="photo">Photos</button><button class="filter" data-filter="2026">2026</button><button class="filter" data-filter="comfort">Comfort</button><button class="filter" data-filter="miss">Miss him</button></div><div class="archive-grid" id="archiveGrid"></div></section>
<footer class="footer"></footer></div><div class="modal-back" id="modalBack"><div class="modal"><button class="close" id="modalClose">×</button><div id="modalContent"></div></div></div><script src="assets/data.js"></script><script src="assets/app.js"></script><script>
let currentFilter="all";
function renderArchive(arr){archiveGrid.innerHTML=arr.length?arr.map(m=>`<article class="archive-card">${m.image?`<div class="archive-img"><img src="${m.image}" alt=""></div>`:"<div class='archive-img'></div>"}<div class="archive-body"><small>${m.accent} ${m.source} · ${m.date}</small><h3>${txt(m.title)}</h3><p>${txt(m.excerpt)}</p><div class="row" style="margin-top:10px"><button class="btn openM" data-id="${m.id}">Open</button><a class="btn" target="_blank" href="${m.url}">Source ↗</a></div></div></article>`).join(""):`<div class="card"><b>${TEXT[LANG].noresult}</b></div>`;document.querySelectorAll(".openM").forEach(b=>b.onclick=()=>openMoment(DATA.moments.find(m=>m.id===b.dataset.id)))}
function apply(){let arr=DATA.moments.slice();if(currentFilter!=="all")arr=arr.filter(m=>m.type===currentFilter||m.year===currentFilter||m.moods?.includes(currentFilter)||m.tags?.some(t=>String(t).toLowerCase().includes(currentFilter)));const q=searchInput.value.trim().toLowerCase();if(q)arr=arr.filter(m=>[m.date,m.year,m.source,txt(m.title),txt(m.excerpt),...(m.tags||[]),...(m.moods||[])].join(" ").toLowerCase().includes(q)||(["下班","累","想他","黑发","照片","鼓励","睡前","weverse"].some(k=>q.includes(k))&&[m.date,m.year,m.source,txt(m.title),txt(m.excerpt),...(m.tags||[]),...(m.moods||[])].join(" ").toLowerCase().includes(({下班:"work",累:"comfort",想他:"miss",黑发:"black hair",照片:"photo",鼓励:"comfort",睡前:"sleep",weverse:"weverse"})[Object.keys({下班:1,累:1,想他:1,黑发:1,照片:1,鼓励:1,睡前:1,weverse:1}).find(k=>q.includes(k))]||q)));renderArchive(arr)}
document.addEventListener("DOMContentLoaded",()=>{renderArchive(DATA.moments);document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentFilter=b.dataset.filter;apply()});searchBtn.onclick=apply;searchInput.onkeydown=e=>{if(e.key==="Enter")apply()}})
</script><script>document.addEventListener("DOMContentLoaded",()=>initNav("archive"));</script></body></html>
