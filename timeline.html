<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Era Timeline · Waiting for DK</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"></head><body><div class="wrap"><nav class="site-nav"></nav>
<section class="glass section"><div class="eyebrow">DK ERA TIMELINE</div><h1 class="page-title">From debut<br>to welcome back.</h1><p class="lede">沿着时间往前走。以后每个 Era 都可以展开成发色、舞台、Cover、音乐剧与照片。</p></section>
<section class="glass section"><div class="timeline" id="timelineList"></div></section>
<section class="glass section"><div class="eyebrow">ON THIS DAY WITH DK</div><h2 class="section-title" id="todayTitle"></h2><div class="card" id="todayCard" style="margin-top:14px"></div></section>
<footer class="footer"></footer></div><div class="modal-back" id="modalBack"><div class="modal"><button class="close" id="modalClose">×</button><div id="modalContent"></div></div></div><script src="assets/data.js"></script><script src="assets/app.js"></script><script>
document.addEventListener("DOMContentLoaded",()=>{timelineList.innerHTML=DATA.timeline.map(e=>`<article class="era"><div class="era-year">${e.year}</div><div><h3>${txt(e.label)}</h3><p>${txt(e.detail)}</p><a class="btn" href="archive.html">Explore this era →</a></div></article>`).join("");const t=kst(),md=`-${String(t.m).padStart(2,"0")}-${String(t.d).padStart(2,"0")}`,exact=DATA.moments.filter(m=>m.date.endsWith(md)),m=(exact.length?exact:DATA.moments)[0];todayTitle.textContent=new Intl.DateTimeFormat(LANG==="zh"?"zh-CN":LANG==="ko"?"ko-KR":"en-US",{month:"long",day:"numeric"}).format(new Date(2026,t.m-1,t.d));todayCard.innerHTML=`<small>${exact.length?"ON THIS DAY":"NEAREST MEMORY"} · ${m.date}</small><h3>${txt(m.title)}</h3><p>${txt(m.excerpt)}</p><a class="btn" target="_blank" href="${m.url}">${TEXT[LANG].open} ↗</a>`})
</script><script>document.addEventListener("DOMContentLoaded",()=>initNav("timeline"));</script></body></html>
